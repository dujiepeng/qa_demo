name: Android Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          if [ -z "$VERSION" ]; then
            echo "Cannot resolve version from pubspec.yaml"
            exit 1
          fi

          TAG="v${VERSION}"
          APK_NAME="qa_demo_${TAG}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate changelog for release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("changelog.md").read_text(encoding="utf-8")
          section_pattern = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}.*?(?=^## |\Z)",
              re.M | re.S,
          )
          section_match = section_pattern.search(changelog)
          if not section_match:
              print(
                  f"changelog.md must contain a release section: ## [{version}] - YYYY-MM-DD",
                  file=sys.stderr,
              )
              sys.exit(1)

          section = section_match.group(0)
          parsed_titles = ("Feature", "UI/UX", "Bug Fix")
          has_release_item = False
          for title in parsed_titles:
              match = re.search(
                  rf"^### {re.escape(title)}\n(.*?)(?=^### |\Z)",
                  section,
                  re.M | re.S,
              )
              if match and any(
                  line.strip().startswith("- ")
                  for line in match.group(1).splitlines()
              ):
                  has_release_item = True
                  break

          if not has_release_item:
              print(
                  "changelog.md release section must include at least one '- ' item "
                  "under ### Feature, ### UI/UX, or ### Bug Fix.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("changelog.md").read_text(encoding="utf-8")
          section_pattern = re.compile(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n(.*?)(?=^## |\Z)",
              re.M | re.S,
          )
          section = section_pattern.search(changelog).group(1).strip()
          Path("RELEASE_NOTES.md").write_text(section + "\n", encoding="utf-8")
          PY

      - name: Build APK (arm64-v8a)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > android/release.jks
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=../release.jks" >> android/key.properties
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons -v
          rm android/release.jks android/key.properties

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          overwrite_files: true

      - name: Notify WeCom with release card
        env:
          WCHAT_HOOK: ${{ secrets.WCHAT_HOOK }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$WCHAT_HOOK" ]; then
            echo "WCHAT_HOOK is not configured, skip WeCom notification."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib import request

          release_tag = os.environ["RELEASE_TAG"]
          repository = os.environ["REPOSITORY"]
          webhook = os.environ["WCHAT_HOOK"]
          apk_name = f"qa_demo_{release_tag}.apk"
          download_url = (
              f"https://github.com/{repository}/releases/download/"
              f"{release_tag}/{apk_name}"
          )
          changelog = Path("changelog.md").read_text(encoding="utf-8")
          section_pattern = re.compile(
              rf"^## \[{re.escape(release_tag.lstrip('v'))}\].*?(?=^## |\Z)",
              re.M | re.S,
          )
          section_match = section_pattern.search(changelog)
          section = section_match.group(0) if section_match else ""

          def extract_items(title: str):
              pattern = re.compile(
                  rf"^### {re.escape(title)}\n(.*?)(?=^### |\Z)",
                  re.M | re.S,
              )
              match = pattern.search(section)
              if not match:
                  return []
              items = []
              for raw_line in match.group(1).splitlines():
                  line = raw_line.strip()
                  if not line.startswith("- "):
                      continue
                  items.append(line[2:].strip())
              return items

          feature_items = extract_items("Feature") + extract_items("UI/UX")
          bugfix_items = extract_items("Bug Fix")

          def to_desc(items):
              if not items:
                  return "无"
              return "\n".join(f"- {item}" for item in items[:4])

          update_items = feature_items + bugfix_items
          update_desc = to_desc(update_items)
          markdown_lines = [
              "# qa_demo 更新",
              f"> 版本号：{release_tag}",
              "",
              "**更新内容**",
              update_desc,
              "",
              "**下载地址**",
              f"[点击下载]({download_url})",
          ]
          payload = {
              "msgtype": "markdown_v2",
              "markdown_v2": {
                  "content": "\n".join(markdown_lines),
              },
          }

          req = request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with request.urlopen(req) as resp:
              body = resp.read().decode("utf-8")
              print(body)
          PY
