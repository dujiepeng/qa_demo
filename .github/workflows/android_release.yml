name: Android Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > android/release.jks
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=../release.jks" >> android/key.properties
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons -v
          rm android/release.jks android/key.properties

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/qa_demo_${GITHUB_REF_NAME}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/qa_demo_${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Notify WeCom with release card
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WCHAT_HOOK: ${{ secrets.WCHAT_HOOK }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$WCHAT_HOOK" ]; then
            echo "WCHAT_HOOK is not configured, skip WeCom notification."
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib import request

          release_tag = os.environ["RELEASE_TAG"]
          repository = os.environ["REPOSITORY"]
          webhook = os.environ["WCHAT_HOOK"]
          apk_name = f"qa_demo_{release_tag}.apk"
          download_url = (
              f"https://github.com/{repository}/releases/download/"
              f"{release_tag}/{apk_name}"
          )
          image_url = (
              "https://raw.githubusercontent.com/dujiepeng/"
              "qa_demo/dev/assets/logo.png"
          )

          changelog = Path("changelog.md").read_text(encoding="utf-8")
          section_pattern = re.compile(
              rf"^## \[{re.escape(release_tag.lstrip('v'))}\].*?(?=^## |\Z)",
              re.M | re.S,
          )
          section_match = section_pattern.search(changelog)
          section = section_match.group(0) if section_match else ""

          def extract_items(title: str):
              pattern = re.compile(
                  rf"^### {re.escape(title)}\n(.*?)(?=^### |\Z)",
                  re.M | re.S,
              )
              match = pattern.search(section)
              if not match:
                  return []
              items = []
              for raw_line in match.group(1).splitlines():
                  line = raw_line.strip()
                  if not line.startswith("- "):
                      continue
                  items.append(line[2:].strip())
              return items

          feature_items = extract_items("Feature") + extract_items("UI/UX")
          bugfix_items = extract_items("Bug Fix")

          def to_desc(items):
              if not items:
                  return "无"
              return "\n".join(f"- {item}" for item in items[:4])

          payload = {
              "msgtype": "template_card",
              "template_card": {
                  "card_type": "news_notice",
                  "source": {
                      "icon_url": image_url,
                      "desc": "qa_demo",
                      "desc_color": 0,
                  },
                  "main_title": {
                      "title": "qa_demo Android 安装包",
                      "desc": apk_name,
                  },
                  "card_image": {
                      "url": image_url,
                      "aspect_ratio": 1.3,
                  },
                  "vertical_content_list": [
                      {
                          "title": "新增",
                          "desc": to_desc(feature_items),
                      },
                      {
                          "title": "修复",
                          "desc": to_desc(bugfix_items),
                      },
                  ],
                  "jump_list": [
                      {
                          "type": 1,
                          "title": "下载 APK",
                          "url": download_url,
                      }
                  ],
                  "card_action": {
                      "type": 1,
                      "url": download_url,
                  },
              },
          }

          req = request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with request.urlopen(req) as resp:
              body = resp.read().decode("utf-8")
              print(body)
          PY
